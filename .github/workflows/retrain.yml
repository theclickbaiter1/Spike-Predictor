name: Retrain Model

on:
  # Triggered by Cloudflare Worker cron (bi-weekly, even ISO weeks) or manual dispatch
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache news + earnings data
        uses: actions/cache@v4
        with:
          path: |
            data/news_cache
            data/earnings_cache
          key: spike-data-cache-${{ github.run_id }}
          restore-keys: spike-data-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain model
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python predict/spike_detector.py --retrain --force

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike-model
          path: |
            data/model_s1.json
            data/model_s2.json
            data/model_ret.json
            data/model_meta.json
            data/model_calibrator.json
            data/model_ising.json
            data/beta_norm.json
            data/tuned_threshold.json
          retention-days: 365
