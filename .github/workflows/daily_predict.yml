name: Daily Spike Prediction

on:
  # Triggered by Cloudflare Worker cron or manual dispatch
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache news + earnings data
        uses: actions/cache@v4
        with:
          path: |
            data/news_cache
            data/earnings_cache
          key: spike-data-cache-${{ github.run_id }}
          restore-keys: spike-data-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download saved model
        uses: dawidd6/action-download-artifact@v3
        with:
          name: spike-model
          path: data/
          workflow: retrain.yml
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Run prediction
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python predict/spike_detector.py

      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predict/notify.py

      - name: Save watchlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-${{ github.run_id }}
          path: output/
          retention-days: 90
