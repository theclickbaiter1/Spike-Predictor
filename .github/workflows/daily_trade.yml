name: Daily Trading

on:
  # Triggered by Cloudflare Worker cron or manual dispatch
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set ET date
        id: et_date
        run: echo "today=$(TZ='America/New_York' date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache news + earnings data
        uses: actions/cache@v4
        with:
          path: |
            data/news_cache
            data/earnings_cache
          key: spike-data-cache-${{ github.run_id }}
          restore-keys: spike-data-cache-

      - name: Cache Telegram subscribers
        uses: actions/cache@v4
        with:
          path: data/subscribers.json
          key: telegram-subscribers-${{ github.run_id }}
          restore-keys: telegram-subscribers-

      - name: Restore trade log (OPEN account)
        uses: actions/cache@v4
        with:
          path: output/trade_log.csv
          key: trade-log-open-${{ github.run_id }}
          restore-keys: trade-log-open-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download saved model
        uses: dawidd6/action-download-artifact@v3
        with:
          name: spike-model
          path: data/
          workflow: retrain.yml
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: fail

      - name: Run predictions (generate watchlist)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python predict/spike_detector.py

      - name: Send prediction watchlist to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predict/notify.py

      - name: Place paper trades (Account OPEN — 9:30 fill)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python predict/trade.py --paper --label open

      - name: Send trade confirmations to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predict/notify.py --trades --label open

      - name: Save watchlist (stable name for validation pickup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-${{ steps.et_date.outputs.today }}
          path: output/watchlist_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Save trade log (OPEN account)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/trade_log.csv
          key: trade-log-open-${{ github.run_id }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_id }}
          path: output/
          retention-days: 365
